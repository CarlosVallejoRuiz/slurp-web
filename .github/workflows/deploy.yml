# Builds dist/ and publishes only that folder to GitHub Pages, then tells
# IndexNow which pages changed. Needs Settings → Pages → Source: GitHub Actions.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changed.outputs.urls }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the sitemap's lastmod comes from the git history
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build
        run: node build.mjs
      - name: Pages that differ from what is live
        id: changed
        run: echo "urls=$(node scripts/changed-urls.mjs)" >> "$GITHUB_OUTPUT"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  indexnow:
    # after the deployment, so the engines fetch the new pages, not the old ones
    needs: [build, deploy]
    if: needs.build.outputs.changed != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Notify IndexNow
        env:
          URLS: ${{ needs.build.outputs.changed }}
        run: node scripts/indexnow.mjs
